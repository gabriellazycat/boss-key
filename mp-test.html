<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOSS KEY — teste de multiplayer</title>
    <style>
      :root { color-scheme: dark; --bg: #0d1020; --panel: #171b2e; --line: #2a3150; --ok: #3ddc97; --bad: #ff6b6b; --ink: #e8ebf6; --dim: #8a90a2; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
      header b { margin-right: 6px; }
      header code { background: #0008; padding: 2px 8px; border-radius: 6px; }
      button { background: #2b3358; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
      button:hover { background: #3a4475; }
      button.go { background: #1d5c45; }
      .grid { flex: 1; display: grid; gap: 4px; padding: 4px; min-height: 0; }
      .cell { position: relative; border: 2px solid var(--line); border-radius: 6px; overflow: hidden; min-height: 0; }
      .cell:focus-within { border-color: #ffd23f; }
      .cell span { position: absolute; top: 4px; left: 6px; z-index: 1; font-size: 12px; background: #000a; padding: 1px 8px; border-radius: 6px; pointer-events: none; }
      iframe { width: 100%; height: 100%; border: 0; display: block; }
      #log { max-height: 34vh; overflow: auto; margin: 0; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
      #log:empty { display: none; }
      .pass { color: var(--ok); } .fail { color: var(--bad); } .info { color: var(--dim); }
    </style>
  </head>
  <body>
    <header>
      <b>🧪 Multiplayer local</b>
      sala <code id="code"></code>
      <button id="add">+ convidado</button>
      <button id="new">nova sala</button>
      <button id="mute">som só na janela focada</button>
      <button id="run" class="go">▶ rodar checagem automática</button>
      <span class="info">clique numa janela para jogar nela · as janelas são abas do mesmo navegador conversando por BroadcastChannel</span>
    </header>
    <div class="grid" id="grid"></div>
    <pre id="log"></pre>
    <script type="module">
      // Página de desenvolvimento: abre o anfitrião e N convidados do BOSS KEY na mesma tela.
      // ?n=3 abre dois convidados; ?room=ABCD fixa o código; ?auto roda a checagem ao carregar.
      const qs = new URLSearchParams(location.search);
      const room = (qs.get('room') || Math.random().toString(36).slice(2, 6)).toUpperCase();
      const VARIANTS = ['voce', 'bia', 'caio'];
      const grid = document.getElementById('grid');
      const logEl = document.getElementById('log');
      document.getElementById('code').textContent = room;
      const frames = [];

      function addWindow(role) {
        const i = frames.length;
        const name = role === 'host' ? 'Anfitrião' : `Convidado ${i}`;
        const src = `./index.html?debug&mp=${role}&room=${room}&name=${encodeURIComponent(name)}&variant=${VARIANTS[i % VARIANTS.length]}`;
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML = `<span>${role === 'host' ? '👑 ' : ''}${name}</span>`;
        const f = document.createElement('iframe');
        f.src = src;
        f.allow = 'autoplay; fullscreen';
        cell.append(f);
        grid.append(cell);
        frames.push(f);
        const n = frames.length;
        grid.style.gridTemplateColumns = `repeat(${n <= 2 ? n : Math.ceil(n / 2)}, 1fr)`;
        grid.style.gridTemplateRows = n <= 2 ? '1fr' : '1fr 1fr';
        return f;
      }

      const n = Math.max(2, Math.min(6, +(qs.get('n') || 2)));
      addWindow('host');
      for (let i = 1; i < n; i++) addWindow('join');

      document.getElementById('add').onclick = () => frames.length < 6 && addWindow('join');
      document.getElementById('new').onclick = () => {
        qs.delete('room');
        location.search = qs.toString();
      };
      let muteOthers = false;
      document.getElementById('mute').onclick = (e) => {
        muteOthers = !muteOthers;
        e.target.textContent = muteOthers ? 'som em todas as janelas' : 'som só na janela focada';
      };
      setInterval(() => {
        for (const f of frames) {
          const a = f.contentWindow?.audio;
          if (!a?.ready) continue;
          const on = !muteOthers || document.activeElement === f;
          if (on && a.ctx.state === 'suspended') a.ctx.resume();
          else if (!on && a.ctx.state === 'running') a.ctx.suspend();
        }
      }, 250);

      // ------------------------------------------------------------------ checagem automática
      const log = (cls, s) => {
        logEl.insertAdjacentHTML('beforeend', `<span class="${cls}">${s.replace(/</g, '&lt;')}</span>\n`);
        logEl.scrollTop = logEl.scrollHeight;
      };
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const W = () => frames.map((f) => f.contentWindow);

      /** Avança todas as janelas (funciona mesmo com a aba em segundo plano, sem rAF) e deixa a rede entregar. */
      async function tick(secs = 0.1) {
        for (const w of W()) w.step?.(secs, 30);
        await wait(40);
      }
      async function until(label, fn, secs = 8) {
        const t0 = performance.now();
        while (performance.now() - t0 < secs * 1000) {
          try {
            if (fn()) return true;
          } catch {}
          await tick(0.1);
        }
        throw new Error(`tempo esgotado: ${label}`);
      }
      const results = [];
      function check(label, ok, detail = '') {
        results.push({ label, ok: !!ok });
        log(ok ? 'pass' : 'fail', `${ok ? '✔' : '✘'} ${label}${detail ? ` — ${detail}` : ''}`);
        return !!ok;
      }

      /** Mira a câmera sentada até o cursor do monitor chegar em (x, y) do canvas 1024×640. */
      async function aimAt(w, r) {
        const pc = w.game.pc;
        const inside = () => { const m = pc.mouseCanvas; return m.x > r.x + 4 && m.x < r.x + r.w - 4 && m.y > r.y + 4 && m.y < r.y + r.h - 4; };
        // ganho (pixels do canvas por pixel de mouse) medido a cada passo, por eixo e com sinal
        const k = { x: 0.6, y: 0.6 };
        for (let i = 0; i < 40 && !inside(); i++) {
          for (const ax of ['x', 'y']) {
            const err = (ax === 'x' ? r.x + r.w / 2 : r.y + r.h / 2) - pc.mouseCanvas[ax];
            const step = Math.max(-40, Math.min(40, err / k[ax]));
            if (Math.abs(step) < 0.5) continue;
            const before = pc.mouseCanvas[ax];
            ax === 'x' ? w.look(step, 0) : w.look(0, step);
            const moved = pc.mouseCanvas[ax] - before;
            if (Math.abs(moved) > 0.5) k[ax] = moved / step;
          }
        }
        return inside();
      }
      function pressMouse(w) {
        const c = w.document.getElementById('gl');
        c.dispatchEvent(new w.MouseEvent('mousedown', { button: 0, bubbles: true }));
        w.step(1 / 30);
        w.dispatchEvent(new w.MouseEvent('mouseup', { button: 0, bubbles: true }));
        w.step(1 / 30);
      }

      async function run() {
        logEl.textContent = '';
        results.length = 0;
        log('info', `sala ${room} · ${frames.length} janelas`);
        try {
          await until('janelas carregarem o modo debug', () => W().every((w) => w.game && w.step), 20);
          const [host, ...guests] = W();
          const all = [host, ...guests];
          for (const w of all) w.fakeLock();
          const total = all.length;

          // 1. sala
          await until('todos entrarem na sala', () => all.every((w) => w.game.net?.members.length === total), 20);
          check('todos veem a sala completa', true, `${total} membros em cada janela`);
          check('só o anfitrião é host', host.game.net.isHost && guests.every((g) => !g.game.net.isHost));
          await until('mesas distribuídas', () => guests.every((g) => g.game.net.slots[g.game.net.self] !== undefined));
          const slots = all.map((w) => w.game.net.slots[w.game.net.self]);
          check('cada jogador tem uma mesa diferente', new Set(slots).size === total, `mesas ${slots.join(', ')}`);
          for (const [i, w] of all.entries()) {
            const g = w.game;
            const nm = g.net.nameOf(g.net.self);
            const d = g.player.desk;
            check(`${nm}: senta na mesa do seu slot`, d === g.office.desks[slots[i]], `mesa ${d.index}`);
            check(`${nm}: monitor no tamanho do BossOS`, d.canvas.width === 1024 && d.canvas.height === 640, `${d.canvas.width}×${d.canvas.height}`);
            const others = g.office.desks.filter((x) => x !== d);
            check(`${nm}: outras telas pequenas`, others.every((x) => x.canvas.width === 256));
            // os itens moram no referencial (girado) da mesa: compara no mundo
            const p = g.office.extras.postit.getWorldPosition(g.office.extras.postit.position.clone());
            check(`${nm}: itens da lojinha na própria mesa`, Math.abs(p.z - d.seat.z) < 1.2 && Math.abs(p.x - d.seat.x) < 1.6);
            const remotes = [...g.net.remotes.keys()];
            check(`${nm}: vê os outros ${total - 1} jogadores`, remotes.length === total - 1);
          }

          // 2. o dia começa no hall (v0.8): cada um sobe pelo elevador; pronto lá em cima → portas abrem para todos
          await until('todos no hall', () => all.every((w) => w.game.running && (w.game.phase === 'lobby' || w.game.phase === 'elevator')), 10);
          for (const w of all) if (w.game.phase === 'lobby') w.skipElevator();
          await until('todos no elevador', () => all.every((w) => w.game.running && w.game.phase === 'elevator'), 10);
          for (const w of all) w.game.net.setReady(true);
          await until('contagem começar', () => all.every((w) => w.game.netCount > 0 || w.game.phase === 'play'), 8);
          check('contagem começa quando todos marcam pronto', true);
          await until('portas abrirem em todas as janelas', () => all.every((w) => w.game.phase === 'play'), 20);
          check('o dia começa em todas as janelas', true, `dia ${all.map((w) => w.game.dayIndex).join('/')}`);
          check('todos no mesmo dia', new Set(all.map((w) => w.game.dayIndex)).size === 1);
          await tick(1);
          const dt = Math.max(...guests.map((g) => Math.abs(g.game.time - host.game.time)));
          check('relógio do convidado segue o do anfitrião', dt < 1.5, `diferença ${dt.toFixed(2)} s`);

          // 3. convidado usa o computador de verdade (sentar, mirar na barra de tarefas, clicar)
          const guest = guests[0];
          const gg = guest.game;
          gg.pc.setMode('seated');
          await tick(1.2);
          check('convidado sentou', gg.pc.mode === 'seated');
          const mc = gg.pc.mouseCanvas;
          check('mira do convidado cai no monitor dele', mc.x > 200 && mc.x < 824 && mc.y > 120 && mc.y < 520, `cursor em ${mc.x.toFixed(0)}, ${mc.y.toFixed(0)}`);
          const btns = gg.computer.btns ?? [];
          // só abre o que está liberado hoje (jogos do PC dependem do sorteio de diversões)
          const unlocked = gg.computer.unlocked;
          const tiroBtn = btns.find((b) => b.id !== 'planilha' && gg.computer.apps[b.id].forbidden && unlocked.includes(b.id)) ?? btns.find((b) => b.id === 'trabalho');
          if (check('barra de tarefas tem app para abrir', tiroBtn, btns.map((b) => b.id).join(', '))) {
            const r = tiroBtn.r;
            const aimed = await aimAt(guest, r);
            check('convidado consegue mirar no botão da barra', aimed, `cursor em ${gg.pc.mouseCanvas.x.toFixed(0)}, ${gg.pc.mouseCanvas.y.toFixed(0)}`);
            pressMouse(guest);
            check(`clique abre o app (${tiroBtn.id})`, gg.computer.active === tiroBtn.id, `ativo: ${gg.computer.active}`);
            const ctx = gg.player.desk.ctx;
            const px = ctx.getImageData(980, 615, 1, 1).data;
            check('BossOS desenhado até o canto da tela', px[3] > 0 && px[0] + px[1] + px[2] > 30, `pixel ${px.slice(0, 3).join(',')}`);
          }

          // 4. o anfitrião enxerga o que o convidado faz
          const id = guest.game.net.self;
          await until('anfitrião ver o convidado sentado', () => host.game.net.remotes.get(id)?.w.seated, 5).catch(() => {});
          const rw = host.game.net.remotes.get(id)?.w;
          check('anfitrião vê o convidado sentado', rw?.seated);
          if (gg.computer.forbiddenOpen) {
            await until('anfitrião ver o jogo proibido', () => rw?.netForbidden, 5).catch(() => {});
            check('anfitrião sabe que o convidado está num jogo proibido', rw?.netForbidden);
          }
          const hp = host.game.player.ball.pos;
          const seen = guest.game.net.remotes.get(host.game.net.self)?.w.ball.pos;
          check('convidado vê o anfitrião no lugar certo', seen && seen.distanceTo(hp) < 0.6, seen ? `${seen.distanceTo(hp).toFixed(2)} m` : 'sem anfitrião');

          // 5. chefias espelhadas: em tempo real (o passo síncrono despeja vários snapshots de uma vez e embaralha a interpolação)
          await wait(1500);
          const bossGap = ['chefe', 'x9', 'dono'].map((k) => {
            const a = host.game[k].ball;
            const b = gg[k].ball;
            if (a.root.visible !== b.root.visible) return `${k}: visível ${a.root.visible}/${b.root.visible}`;
            return a.root.visible && a.pos.distanceTo(b.pos) > 1.2 ? `${k}: ${a.pos.distanceTo(b.pos).toFixed(2)} m` : '';
          }).filter(Boolean);
          check('chefias aparecem no mesmo lugar para o convidado', !bossGap.length, bossGap.join(' · ') || (document.hidden ? 'aba oculta: sem rAF, resultado pouco confiável' : ''));

          // 5b. clientes do chefe (só o host simula): o convidado vê o boneco chegando
          host.game.clients['schedule'] = [host.game.time];
          await until('convidado ver o cliente', () => gg.clients['list'].length > 0 && gg.clients['list'][0].ball.root.visible, 5).catch(() => {});
          await tick(1);
          await wait(600);
          const hc = host.game.clients['list'][0];
          const gc = gg.clients['list'][0];
          check('convidado vê o cliente do chefe', !!gc && gc.ball.root.visible && hc && gc.ball.pos.distanceTo(hc.ball.pos) < 1.5, gc && hc ? `${gc.ball.pos.distanceTo(hc.ball.pos).toFixed(2)} m` : 'sem cliente no convidado');

          // 6. ranking com os nomes da sala
          const names = host.game.net.ranking().map((x) => x.name).sort();
          const expected = host.game.net.members.map((m) => m.name).sort();
          check('ranking usa os nomes da sala', JSON.stringify(names) === JSON.stringify(expected), names.join(', '));

          // 6b. run infinita: eventos do dia iguais para todos, tarefa repassada e aviso do fantasma
          const evs = all.map((w) => w.game.dayEvents.join('+'));
          check('todos têm os mesmos eventos do dia', new Set(evs).size === 1, evs.join(' / '));
          const extras = guest.game.tasks['slots'].length;
          host.game.net.handoff(['galao']);
          // o host escolhe o colega por rodízio: vale qualquer convidado
          const gotExtra = () => guests.some((x) => x.game.tasks['slots'].some((s) => s.extra && s.kind === 'galao'));
          await until('um colega receber a tarefa herdada', gotExtra, 5).catch(() => {});
          check('tarefa de quem foi demitido vai para um colega', gotExtra(), `antes ${extras}`);
          const pings = host.game.pings.length;
          guest.game.player.fired = true;
          guest.game.ghostPing();
          await until('anfitrião ver o aviso do fantasma', () => host.game.pings.length > pings, 5).catch(() => {});
          check('fantasma avisa a sala onde o chefe está', host.game.pings.length > pings);
          guest.game.player.fired = false;

          // 6b2. v0.9: agenda e missão do dia iguais; item pego pelo convidado; distração do convidado
          const ags = all.map((w) => w.game.agenda.items.map((x) => `${x.kind}@${x.at}`).join(','));
          check('todos têm a mesma agenda do chefe', new Set(ags).size === 1 && ags[0].length > 0, ags[0]);
          const mis = all.map((w) => `${w.game.missions.big}|${w.game.missions.keySpot}|${w.game.missions.locker}`);
          check('todos têm a mesma missão do dia', new Set(mis).size === 1, mis.join(' / '));
          const hm = host.game.missions;
          const hit = host.game.items.list[0];
          // o host põe o item no chão perto do convidado; o convidado pede para pegar
          gg.pc.setMode('walk');
          await tick(0.3);
          hit.status = 'rest';
          hit.holders = [];
          hit.pos.copy(host.game.net.remotes.get(id).w.ball.pos);
          if (hm.big === 'grampeador') hm.step = 2;
          else hm.step = 0;
          await tick(0.3);
          gg.items['request']('pick', hit.id);
          await until('host ver o convidado segurando o item', () => hit.holders.some((w) => w.remote === id), 5).catch(() => {});
          check('convidado pega o item da missão (o host decide)', hit.holders.some((w) => w.remote === id), `${hit.status} · ${hit.holders.map((w) => w.name).join(',')}`);
          await until('convidado ver o item na própria mão', () => gg.items.heldBy(gg.player), 5).catch(() => {});
          check('o convidado sabe que está segurando o item', !!gg.items.heldBy(gg.player));
          gg.items['request']('drop', hit.id);
          await until('host ver o item no chão', () => hit.status === 'rest', 5).catch(() => {});
          check('convidado larga o item (Q)', hit.status === 'rest');
          const cd0 = host.game.distract.cd.radio;
          gg.distract.trigger('radio');
          await until('host aplicar o rádio do convidado', () => host.game.distract.cd.radio > cd0, 5).catch(() => {});
          await until('convidado ouvir o rádio', () => gg.distract.radioT > 0, 5).catch(() => {});
          check('distração do convidado vale para a sala', host.game.distract.cd.radio > 0 && gg.distract.radioT > 0, `recarga no host ${Math.round(host.game.distract.cd.radio)} s · rádio no convidado ${Math.round(gg.distract.radioT)} s`);

          // 6b3. v0.10: vigilância igual para todos, papo do convidado para o chefe do host, missão pedida pelo convidado
          const svs = all.map((w) => `${w.game.surv.code}|${w.game.surv.codeSpot}`);
          check('todos têm o mesmo código da porta do chefe', new Set(svs).size === 1, svs.join(' / '));
          const hb = host.game.bosses[0];
          const rwg = host.game.net.remotes.get(id).w;
          gg.talkBank = 16;
          const gb = gg.bosses.find((b) => b.kind === hb.kind);
          // o convidado vai até o chefe (na tela dele) e puxa papo; quem decide é o host
          gg.player.ball.setPos(hb.pos.x + 1.2, hb.pos.z + 1.2);
          await tick(0.4);
          await wait(700);
          gg.startTalk(gb);
          await until('chefe do host conversar com o convidado', () => hb.talkW === rwg, 5).catch(() => {});
          check('papo do convidado para o chefe do host', hb.talkW === rwg, `chefe ${hb.state} · conversando com ${hb.talkW?.name ?? 'ninguém'}`);
          const st0 = hm.step;
          if (hm.big === 'grampeador') {
            hm.step = 0;
            gg.missions.step = 0;
            const i = hm.keySpot;
            gg.player.ball.setPos(hm.spots[i].pos.x, hm.spots[i].pos.z);
            await tick(0.4);
            await wait(700);
            gg.missions['request'](`m:found${i}`);
            await until('host avançar a missão pelo convidado', () => hm.step === 1 && gg.missions.step === 1, 6).catch(() => {});
            check('convidado acha a chave e a missão avança para todos', hm.step === 1 && gg.missions.step === 1, `host ${hm.step} · convidado ${gg.missions.step}`);
          } else check('convidado acha a chave e a missão avança para todos', true, `missão de hoje: ${hm.big} (pulado)`);
          hm.step = st0;

          // 6c. cofre do time (v0.8): o convidado vê o vale do host e compra pelo host
          host.game.shop.wallet = 50;
          host.game.net.syncShop();
          await until('convidado ver o cofre', () => guest.game.wallet === 50, 5).catch(() => {});
          check('cofre do time chega ao convidado', guest.game.wallet === 50, `${guest.game.wallet}`);
          guest.game.net.vale(6);
          await until('host somar o vale do convidado', () => host.game.wallet === 56, 5).catch(() => {});
          check('vale do convidado soma no cofre', host.game.wallet === 56, `${host.game.wallet}`);
          guest.game.net.buy('pantufas');
          await until('compra confirmada', () => guest.game.shop.count('pantufas') === 1 && host.game.shop.count('pantufas') === 1, 5).catch(() => {});
          check('compra do convidado sai do cofre do time', host.game.shop.count('pantufas') === 1 && guest.game.shop.count('pantufas') === 1 && guest.game.wallet === 56 - 10, `host ${host.game.wallet} · convidado ${guest.game.wallet}`);

          // 7. convidado sai pelo menu (mesmo caminho do "sair" da pausa): some para o anfitrião
          const left = guests[guests.length - 1];
          const leftId = left.game.net.self;
          left.leaveRoom();
          await until('anfitrião notar a saída', () => !host.game.net.members.some((m) => m.id === leftId), 6).catch(() => {});
          check('quem sai some da sala do anfitrião', !host.game.net.members.some((m) => m.id === leftId));
          check('mesa de quem saiu fica vazia no anfitrião', ![...host.game.net.remotes.keys()].includes(leftId));
        } catch (e) {
          check('checagem terminou', false, e.message);
        }
        const bad = results.filter((r) => !r.ok).length;
        log(bad ? 'fail' : 'pass', `\n${results.length - bad}/${results.length} ok${bad ? ` · ${bad} falha(s)` : ''}`);
        window.mpResult = { ok: bad === 0, results };
        if (bad === 0) log('info', 'recarregue a página para jogar de novo (a última janela saiu da sala no teste)');
      }
      document.getElementById('run').onclick = run;
      window.runCheck = run;
      if (qs.has('auto')) run();
    </script>
  </body>
</html>
